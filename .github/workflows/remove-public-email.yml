name: Limpar contato publico e historico

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: albuns-nas-contact-history-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositorio existente
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Conferir escopo e preparar substituicoes privadas
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          assert os.environ['GITHUB_REPOSITORY'] == 'Lamparejo/albuns-nas'
          assert git('symbolic-ref', 'HEAD') == 'refs/heads/main'
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD^') == '5a7dc7d94e1a070682c3481b4647a99adc16ebb6'
          assert git('rev-list', '--count', 'HEAD') == '5'
          assert not git('status', '--porcelain')
          names = set(git('ls-files').splitlines())
          public = {'index.html', 'privacidade.html', 'termos.html', 'site.css'}
          assert names == public | {'.github/workflows/remove-public-email.yml'}
          old = re.search(rb'mailto:([^"\s]+)', pathlib.Path('index.html').read_bytes()).group(1)
          new = b'lamparejo@outlook.com'
          assert old != new and re.fullmatch(rb'[^@\s]+@[^@\s]+', old)
          for name in public - {'site.css'}:
              assert pathlib.Path(name).read_bytes().count(old) == 2
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          (temp / 'privacy-original-head').write_text(head)
          (temp / 'privacy-old-address').write_bytes(old)
          (temp / 'privacy-replacements.txt').write_bytes(b'literal:' + old + b'==>' + new + b'\n')
          (temp / 'privacy-mailmap').write_bytes(b'<' + new + b'> <' + old + b'>\n')
          print(json.dumps({'preflight': 'passed', 'publicFiles': 4, 'originalContentCommits': 4,
                            'contact': new.decode(), 'forcedUpdateGuard': 'exact-current-remote-head'}))
          PY

      - name: Instalar ferramenta oficial no runner temporario
        run: python -m pip install --disable-pip-version-check git-filter-repo==2.47.0

      - name: Reescrever conteudo mensagens e emails dos commits
        shell: bash
        run: |
          git filter-repo --force --replace-text "$RUNNER_TEMP/privacy-replacements.txt" --replace-message "$RUNNER_TEMP/privacy-replacements.txt" --mailmap "$RUNNER_TEMP/privacy-mailmap" --refs refs/heads/main
          git rm -- .github/workflows/remove-public-email.yml
          git -c user.name=Lamparejo -c user.email=lamparejo@outlook.com -c commit.gpgsign=false commit -m "Concluir limpeza do contato publico"

      - name: Verificar todas as versoes e publicar com protecao de concorrencia
        id: rewrite
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          def raw(*args):
              return subprocess.check_output(['git', *args])
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          old = (temp / 'privacy-old-address').read_bytes().lower()
          expected = (temp / 'privacy-original-head').read_text().strip()
          commits = raw('rev-list', 'main').decode().splitlines()
          checked = set()
          for commit in commits:
              assert old not in raw('cat-file', 'commit', commit).lower(), 'old address in commit metadata or message'
              entries = raw('ls-tree', '-rz', commit).split(b'\0')
              for entry in entries:
                  if not entry:
                      continue
                  metadata, name = entry.split(b'\t', 1)
                  mode, kind, oid = metadata.split()
                  assert kind == b'blob', 'unexpected non-file object'
                  if oid not in checked:
                      assert old not in raw('cat-file', 'blob', oid.decode()).lower(), 'old address in historical file'
                      checked.add(oid)
          assert set(raw('ls-files').decode().splitlines()) == {'index.html','privacidade.html','termos.html','site.css'}
          for name in ('index.html', 'privacidade.html', 'termos.html'):
              assert pathlib.Path(name).read_bytes().count(b'lamparejo@outlook.com') == 2
          assert raw('rev-list', '--max-parents=0', 'main').decode().strip() != 'e8c2d758770dbfb1095f94be9e91ab6cd2aabed8'
          assert not raw('status', '--porcelain').strip()
          remote = raw('ls-remote', 'origin', 'refs/heads/main').decode().split()[0]
          assert remote == expected, 'remote changed; refusing to overwrite concurrent work'
          new_head = raw('rev-parse', 'HEAD').decode().strip()
          print(json.dumps({'verification':'passed','reachableCommitsChecked':len(commits),
                            'historicalBlobsChecked':len(checked),'oldEmailOccurrences':0,
                            'newContact':'lamparejo@outlook.com','head':new_head}))
          subprocess.run(['git','push','--force-with-lease=refs/heads/main:'+expected,'origin','main'],check=True)
          assert raw('ls-remote','origin','refs/heads/main').decode().split()[0] == new_head
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('new_head='+new_head+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Contato publico atualizado para **lamparejo@outlook.com**.\n\n')
              out.write('Historico remoto reescrito e conferido: **zero ocorrencias do email anterior** nos commits e arquivos alcancaveis pela main.\n\n')
              out.write('Commits conferidos: '+str(len(commits))+'. Arquivos historicos conferidos: '+str(len(checked))+'.\n\n')
              out.write('Novo commit: `'+new_head+'`. O fluxo temporario foi retirado da versao atual do repositorio.\n')
          PY

      - name: Solicitar nova publicacao do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REWRITTEN_HEAD: ${{ steps.rewrite.outputs.new_head }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status: .status, commit: .commit}'
